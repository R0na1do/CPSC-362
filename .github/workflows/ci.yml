name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint code
        uses: super-linter/super-linter@v8.7.0
        env:
          VALIDATE_CHECKOV: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
